# Scaled config: wider (base 64) + deeper (3 stages). Keeps drift augmentation.
dataset:
  root: "/mnt/d/Subhransu workspace/Dataset/my_kitti_dataset/dataset/sequences"
  semantic_yaml: "/mnt/d/Subhransu workspace/Dataset/my_kitti_dataset/dataset/sequences/semantic-kitti.yaml"   # official, for the 19-class map
  train_sequences: [0, 1, 2, 3, 4, 5, 6, 7, 9, 10]
  val_sequences: [8]
  n_frames: 4
  voxel_size: 0.1
  point_range: 51.2
  num_semantic: 20

pose:
  mode: drift          # keep drift augmentation (proven robustness)
  rot_std_deg: 0.5
  trans_std_m: 0.1
  seed: 0

model:
  base: 64
  n_stages: 3
  use_se: true
  use_ego_decouple: false   # proven to add nothing

train:
  batch_size: 2
  lr: 5.0e-4          # down from 1e-3
  accum_steps: 4      # effective batch = 8
  warmup_iters: 500
  lr_schedule: cosine
  iters: 40000
  val_every: 1000
  num_workers: 8
  patience: 8
  weight_decay: 1.0e-4         # early stop if no val improvement for 8 checks

loss:
  motion_weight: 1.0
  semantic_weight: 1.0
  dice_weight: 1.0
  moving_class_weight: 5.0
  consistency_weight: 0.0

robustness:
  rot_std_deg_sweep: [0.0, 0.25, 0.5, 1.0, 2.0]
  trans_std_m_sweep: [0.0, 0.05, 0.1, 0.2, 0.4]