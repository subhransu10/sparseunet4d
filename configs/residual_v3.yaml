# residual_v3: recall-focused MOS tuning on top of residual_v2.
#   - Tversky loss ON (beta>alpha favours recall -> attacks the FN problem)
#   - semantic head down-weighted (it dominated the loss but only reached
#     ~0.39 mIoU and starved the motion head for a MOS-headline run)
#   - validation now selects best.pt by the threshold-optimal moving IoU
#     (see scripts/train.py); no config knob needed for that.
dataset:
  root: /mnt/d/Subhransu workspace/Dataset/my_kitti_dataset/dataset/sequences
  semantic_yaml: /mnt/d/Subhransu workspace/Dataset/my_kitti_dataset/dataset/sequences/semantic-kitti.yaml
  train_sequences:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  - 9
  - 10
  val_sequences:
  - 8
  n_frames: 4
  voxel_size: 0.1
  point_range: 51.2
  residual_feats: true
  res_clip: 3.0
pose:
  mode: gt
  rot_std_deg: 0.0
  trans_std_m: 0.0
  seed: 0
train:
  batch_size: 2
  iters: 40000
  lr: 0.001
  weight_decay: 0.0001
  val_every: 1000
loss:
  motion_weight: 1.0
  semantic_weight: 0.3       # was 1.0; semantic CE dominated & starved MOS
  dice_weight: 1.0
  moving_class_weight: 5.0
  consistency_weight: 0.0
  tversky: true              # was off; recall-favouring loss for the FN problem
  tversky_alpha: 0.3
  tversky_beta: 0.7
robustness:
  rot_std_deg_sweep:
  - 0.0
  - 0.25
  - 0.5
  - 1.0
  - 2.0
  trans_std_m_sweep:
  - 0.0
  - 0.05
  - 0.1
  - 0.2
  - 0.4
model: {}
