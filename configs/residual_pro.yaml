# residual_pro (Run A): the pro-standard config on top of the temporal window.
#   - model capacity: base 32->64, 2->3 stages (bigger receptive field reaches
#     the far/slow silent movers; your best model so far was tiny)
#   - train-time augmentation: z-rotation + x/y flips + scale (you had NONE;
#     this is the biggest generalization lever for LiDAR seg)
#   - longer schedule + warmup so the larger, augmented model converges
# Everything else matches residual_temporal (semantic 1.0, strided [1,2,4,8]).
dataset:
  root: /mnt/d/Subhransu workspace/Dataset/my_kitti_dataset/dataset/sequences
  semantic_yaml: /mnt/d/Subhransu workspace/Dataset/my_kitti_dataset/dataset/sequences/semantic-kitti.yaml
  train_sequences: [0, 1, 2, 3, 4, 5, 6, 7, 9, 10]
  val_sequences: [8]
  n_frames: 5
  frame_offsets: [1, 2, 4, 8]
  voxel_size: 0.1
  point_range: 51.2
  residual_feats: true
  res_clip: 3.0
  augment: true          # z-rot + flips + scale, applied identically per stack
pose:
  mode: gt
  rot_std_deg: 0.0
  trans_std_m: 0.0
  seed: 0
train:
  batch_size: 2          # base64/3-stage is ~4x memory; if OOM -> batch_size 1 + accum_steps 2
  accum_steps: 1
  iters: 40000
  lr: 0.001
  weight_decay: 0.0001
  warmup_iters: 1500
  val_every: 1000
loss:
  motion_weight: 1.0
  semantic_weight: 1.0
  dice_weight: 1.0
  moving_class_weight: 5.0
  consistency_weight: 0.0
robustness:
  rot_std_deg_sweep: [0.0, 0.25, 0.5, 1.0, 2.0]
  trans_std_m_sweep: [0.0, 0.05, 0.1, 0.2, 0.4]
model:
  base: 32
  n_stages: 2
  use_se: true
